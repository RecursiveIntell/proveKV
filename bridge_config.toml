[apps.tool]
enabled = true
max_forks = 2
freshness_secs = 60
fork_overlap_min = 0.99

[apps.memory]
enabled = true
max_forks = 64
freshness_secs = 1800
fork_overlap_min = 0.5

[apps.context]
enabled = true
max_forks = 8
freshness_secs = 300
fork_overlap_min = 0.85

[default]
enabled = true
max_forks = 16
freshness_secs = 300
fork_overlap_min = 0.8

[retention]
